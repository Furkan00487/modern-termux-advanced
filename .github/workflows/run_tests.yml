name: Unit tests

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
    - name: Setup Java 17
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Execute tests
      run: |
        chmod +x ./gradlew
        ./gradlew test
