buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:9.5.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21"
        classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.4.21"
        classpath "org.jetbrains.kotlin.plugin.serialization:org.jetbrains.kotlin.plugin.serialization.gradle.plugin:2.4.21"
        classpath "org.bouncycastle:bcprov-jdk18on:1.87"
        classpath "org.bouncycastle:bcpkix-jdk18on:1.87"
        classpath "io.netty:netty-codec-http2:4.2.21.Final"
        classpath "io.netty:netty-handler:4.2.21.Final"
        classpath "io.netty:netty-handler-proxy:4.2.21.Final"
        classpath "org.bitbucket.b_c:jose4j:0.9.7"
        classpath "org.jdom:jdom2:2.0.6.1"
        classpath "com.google.protobuf:protobuf-java:4.36.2"
        classpath "com.google.protobuf:protobuf-kotlin:4.36.2"
        classpath "org.apache.commons:commons-compress:1.28.0"
        classpath "org.apache.commons:commons-lang3:3.22.0"
        classpath "org.tukaani:xz:1.12"
        classpath "com.google.guava:guava:33.8.0-jre"
        classpath "org.apache.httpcomponents:httpclient:4.5.14"
        classpath "org.apache.httpcomponents:httpmime:4.5.14"
        classpath "org.apache.httpcomponents:httpcore:4.4.16"
    }
    configurations.all {
        resolutionStrategy {
            force "org.bouncycastle:bcprov-jdk18on:1.87"
            force "org.bouncycastle:bcpkix-jdk18on:1.87"
            force "io.netty:netty-codec:4.2.21.Final"
            force "io.netty:netty-codec-http:4.2.21.Final"
            force "io.netty:netty-codec-http2:4.2.21.Final"
            force "io.netty:netty-handler:4.2.21.Final"
            force "io.netty:netty-handler-proxy:4.2.21.Final"
            force "org.bitbucket.b_c:jose4j:0.9.7"
            force "org.jdom:jdom2:2.0.6.1"
            force "com.google.protobuf:protobuf-java:4.36.2"
            force "com.google.protobuf:protobuf-kotlin:4.36.2"
            force "org.apache.commons:commons-compress:1.28.0"
            force "org.apache.commons:commons-lang3:3.22.0"
            force "com.google.guava:guava:33.8.0-jre"
            force "org.apache.httpcomponents:httpclient:4.5.14"
            force "org.apache.httpcomponents:httpmime:4.5.14"
            force "org.apache.httpcomponents:httpcore:4.4.16"
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    configurations.all {
        resolutionStrategy {
            force "org.bouncycastle:bcprov-jdk18on:1.87"
            force "org.bouncycastle:bcpkix-jdk18on:1.87"
            force "io.netty:netty-codec:4.2.21.Final"
            force "io.netty:netty-codec-http:4.2.21.Final"
            force "io.netty:netty-codec-http2:4.2.21.Final"
            force "io.netty:netty-handler:4.2.21.Final"
            force "io.netty:netty-handler-proxy:4.2.21.Final"
            force "org.bitbucket.b_c:jose4j:0.9.7"
            force "org.jdom:jdom2:2.0.6.1"
            force "com.google.protobuf:protobuf-java:4.36.2"
            force "com.google.protobuf:protobuf-kotlin:4.36.2"
            force "org.apache.commons:commons-compress:1.28.0"
            force "org.apache.commons:commons-lang3:3.22.0"
            force "com.google.guava:guava:33.8.0-android"
            force "org.apache.httpcomponents:httpclient:4.5.14"
            force "org.apache.httpcomponents:httpmime:4.5.14"
            force "org.apache.httpcomponents:httpcore:4.4.16"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
